# redmine_hierarchy_sort/config/locales/en.yml
en:
  label_attribute_of_parent: "Up: %{name}"
  label_parent_issue_filters: "Parent task"

  hierarchy_sort:
    # Checkboxes in "Options" block
    tree_checkbox: "Subtasks tree"
    relations_checkbox: "Show relations"
    
    # Block headers
    child_filters_block: "Subtasks filters"
    child_sort_block: "Subtasks sorting"
    
    # Information messages
    child_filters_info: "Filters apply to child tasks. If a task does not pass the filter, it and all its descendants will not be shown."
    child_sort_info: "Sorting applies only to tasks at the same level (siblings). Nested levels always follow the parent."
    
    # Tooltip for relations icon
    relations_tooltip: "Relations"
    
    # Direction icons
    direction_outgoing: "→"
    direction_incoming: "←"
    direction_bidirectional: "↔"
    
    # Errors and messages
    errors:
      invalid_filter: "Invalid subtask filter"
      invalid_sort: "Invalid subtask sorting"